<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410"><rect width="960" height="410" rx="32" fill="#FFFAF2"/><circle cx="880" cy="85" r="90" fill="#E7D9C5"/><circle cx="850" cy="95" r="43" fill="#D5B99B"/><path d="M775 240 Q820 155 900 225 M795 260 Q860 180 930 255" fill="none" stroke="#A0A989" stroke-width="9" stroke-linecap="round"/><text x="55" y="60" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="19" fill="#947960" font-weight="600">A QUIET LITTLE CORNER / 一处安静的角落</text><text x="55" y="144" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="67" fill="#514234" font-weight="700">Kevin Lee</text><text x="55" y="195" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="25" fill="#594838" font-weight="400">Engineering, stories &amp; little curiosities.</text><text x="55" y="238" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="23" fill="#806954" font-weight="400">工程、故事，以及生活里的一点好奇。</text><rect x="50" y="276" width="720" height="100" rx="24" fill="#F1E4D3"/><text x="78" y="318" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="28" fill="#604B3A" font-weight="600">A little serious, a little free.</text><text x="78" y="351" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="23" fill="#806650" font-weight="400">认真一点，也自由一点。</text></svg>